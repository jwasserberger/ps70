<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CapKey Development Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"> 
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto Mono', monospace;
      background-color: #000000;
      color: white;
      padding: 20px;
    }
    .typing-container pre span#cursor {
      border-right: 6px solid white;
      animation: blink 0.7s steps(2) infinite;
    }
    @keyframes blink {
      0% { border-color: white; }
      50% { border-color: transparent; }
      100% { border-color: white; }
    }
    a { color: #ff0000; text-decoration: none; }
    .red-text { color: #ff0000; }
  </style>
</head>
<body>
  <div class="typing-container">
    <pre id="typing-text"><span id="cursor"></span></pre>
  </div>

  <script>
    const content = [
      { type: "link", text: "back to home", href: "https://jlhansen9.github.io/PS70/" },
      "\n\n",
      { type: "red", text: "# CapKey Development Log" },
      "\n\n",
      "## 1. Switched from capacitive sensors to toggle buttons",
      "\n",
      "- Original design used capacitive touch pads requiring a 'pinch' between two copper pieces.",
      "- Switched to toggle push-buttons for reliability and ease of use.",
      "\n\n",
      "## 2. Debounce & Toggle Logic",
      "\n",
      "- Implemented INPUT_PULLUP and LOW-edge detection.",
      "- Added 300ms debounce to prevent double-triggers.",
      "\n\n",
      "## 3. OLED Display Integration",
      "\n",
      "- Used Adafruit SSD1306 128x64 I2C on SDA=21, SCL=22.",
      "- Display shows current mode and sending progress bar.",
      "\n\n",
      "### Screen Cover Design",
      "\n",
      "- Designed a protective & stylistic cover in Autodesk Fusion.",
      { type: "link", text: "Download Screen Cover v2", href: "Screen Cover v2.3mf" },
      "\n\n",
      "### Keyboard Case Iterations",
      "\n",
      "- Three iterations refined sizing & button spacing.",
      { type: "link", text: "Download Keyboard Case v3", href: "Keyboard Case v3.3mf" },
      "\n",
      "- Added a slot to conceal wiring neatly.",
      { type: "link", text: "Download Keyboard Slot v1", href: "Keyboard Slot v1.3mf" },
      "\n\n",
      "## 4. Final Code",
      "\n",
      { type: "link", text: "Download Final Sketch", href: "final_sketch.ino" },
      "\n\n",
      "That's the summary of our recent work—building a robust, button-driven BLE keyboard with OLED feedback and a protective case."
    ];

    let index = 0;
    const typingSpeed = 25;
    const typingTextElement = document.getElementById("typing-text");
    const cursor = document.getElementById("cursor");

    function typeContent() {
      if (index < content.length) {
        const item = content[index];
        if (typeof item === "string") {
          typeString(item, 0);
        } else if (item.type === "link") {
          const a = document.createElement("a");
          a.href = item.href;
          a.className = "red-text";
          a.textContent = "";
          typingTextElement.insertBefore(a, cursor);
          typeStringInElement(a, item.text, 0);
        } else if (item.type === "red") {
          const span = document.createElement("span");
          span.className = "red-text";
          typingTextElement.insertBefore(span, cursor);
          typeStringInElement(span, item.text, 0);
        }
      }
    }

    function typeString(str, charIndex) {
      if (charIndex < str.length) {
        typingTextElement.insertBefore(document.createTextNode(str.charAt(charIndex)), cursor);
        setTimeout(() => typeString(str, charIndex + 1), typingSpeed);
      } else {
        index++;
        setTimeout(typeContent, typingSpeed);
      }
    }

    function typeStringInElement(elem, str, charIndex) {
      if (charIndex < str.length) {
        elem.textContent += str.charAt(charIndex);
        setTimeout(() => typeStringInElement(elem, str, charIndex + 1), typingSpeed);
      } else {
        index++;
        typingTextElement.insertBefore(document.createElement("br"), cursor);
        setTimeout(typeContent, typingSpeed);
      }
    }

    window.onload = typeContent;
  </script>
</body>
</html>
