<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ps70 week 7: MVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto Mono', monospace;
      background-color: #000;
      color: #fff;
      padding: 20px;
    }
    a { color: #f00; text-decoration: none; }
    .typing-container { white-space: pre-wrap; word-wrap: break-word; }
    .typing-container pre { margin: 0; }
    .typing-container pre span#cursor {
      border-right: 6px solid white;
      animation: blink 0.7s steps(2) infinite;
    }
    @keyframes blink {
      0%,100% { border-color: white; }
      50%     { border-color: transparent; }
    }
    img, video {
      display: block;
      margin: 20px auto;
      max-width: 800px;
      border: 2px solid #f00;
    }
    #code-container {
      display: none;
      opacity: 0;
      transition: opacity 1s ease-in;
      margin-top: 20px;
    }
    #code-container pre {
      background: #111;
      padding: 10px;
      border: 1px solid #444;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="typing-container">
    <!-- first static image -->
    <img src="week7/IMG_0653.png" alt="Old-School Loading Image"
         onerror="this.style.display='none'">
    <!-- first video -->
    <video src="week7/IMG_0654 copy.mp4" controls
           onerror="console.warn('Video1 missing')"></video>
    <!-- second video -->
    <video src="week7/IMG_0892.MOV" controls
           onerror="console.warn('Video2 missing')"></video>
    <pre id="typing-text"><span id="cursor"></span></pre>
  </div>

  <div id="code-container">
    <pre id="code-snippet">
#include &lt;BleKeyboard.h&gt;
// …
    </pre>
    <a href="#" onclick="copyToClipboard('code-snippet')">Copy Code</a>
  </div>

  <script>
    const content = [
      {type:"link", text:"back to home", href:"https://jwasserberger.github.io/ps70/"},
      "\n\n",
      "/week seven: microcontroller programming",
      "\n\n",
      {type:"red", text:"# lights..."},
      "\n",
      {type:"red", text:"----------------------------------------"},
      "\n\n",
      "given that i am making a keyboard, the first step was to make *drumroll please* a key!\n\n",
      "as far as a 'minimum viable product' this is about as minimum as it gets, but actually pretty important for the final project\n\n",
      "we now have proof that a keyboard *can* be built, so now it's just about expanding out this code to include full keyboard functionality, and then add a few keys for the pre-written components\n\n",
      "the next step will be to start printing keycaps and a keyboard housing shell and then structure the internals to fit within\n\n",
      "for the oscilloscope portion of the assignment, i measured the final keyboard on the scope and found that our device is operating on a roughly 13.5616ms clock\n\n",
      "interestingly, the power seemed to fluctuate between 35–36kHz and 50–240Hz. see below:\n\n"
    ];

    let idx = 0, speed = 25;
    const textEl = document.getElementById("typing-text"),
          cursor = document.getElementById("cursor");

    function typeNext() {
      if (idx >= content.length) {
        showCode(); return;
      }
      const item = content[idx++];
      if (typeof item === "string") {
        typeStr(item,0);
      } else if (item.type === "link") {
        const a=document.createElement("a");
        a.href=item.href; a.textContent="";
        textEl.insertBefore(a,cursor);
        typeIn(a,item.text,0);
      } else if (item.type==="red") {
        const span=document.createElement("span");
        span.style.color="#f00";
        textEl.insertBefore(span,cursor);
        typeIn(span,item.text,0);
      }
    }

    function typeStr(str,i) {
      if(i<str.length){
        textEl.insertBefore(document.createTextNode(str[i]),cursor);
        setTimeout(()=>typeStr(str,i+1),speed);
      } else setTimeout(typeNext,speed);
    }

    function typeIn(el,str,i){
      if(i<str.length){
        el.textContent+=str[i];
        setTimeout(()=>typeIn(el,str,i+1),speed);
      } else {
        textEl.insertBefore(document.createElement("br"),cursor);
        setTimeout(typeNext,speed);
      }
    }

    function showCode(){
      const kc=document.getElementById("code-container");
      kc.style.display="block";
      setTimeout(()=>kc.style.opacity="1",100);
    }

    function copyToClipboard(id){
      const txt=document.getElementById(id).innerText;
      navigator.clipboard.writeText(txt).then(_=>alert("Copied!"));
    }

    window.onload=typeNext;
  </script>
</body>
</html>
