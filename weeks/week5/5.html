<head>
  <title>ps70 week5: 3D fabrication</title>

  <style>
    body {
      font-family: 'Roboto Mono', monospace;
      background-color: #000000;
      color: white;
      padding: 20px;
    }

    .typing-container pre span#cursor {
      border-right: 6px solid white;
      animation: blink 0.7s steps(2) infinite;
    }

    @keyframes blink {
      0% { border-color: white; }
      50% { border-color: transparent; }
      100% { border-color: white; }
    }

    a {
      color: #ff0000;
      text-decoration: none;
    }

    .red-text {
      color: #ff0000;
    }

    /* Hide code snippet and button initially */
    #code-container {
      display: none;
      opacity: 0;
      transition: opacity 1s ease-in;
    }
  </style>
</head>

<body>
  <div class="typing-container">
    <pre id="typing-text"><span id="cursor"></span></pre>
  </div>
</pre>

<script>

const content = [
  { type: "link", text: "back to home", href: "https://jwasserberger.github.io/ps70/" },
  "\n\n",
  "/week five: 3D fabrication",
  "\n\n",
  { type: "red", text: "# desk toy..." },
  "\n",
  { type: "red", text: "--------------------------------------------------------------------------------" },
  "\n\n",
  "i wanted to make a little desk buddy to look painfully at while you're grinding a pset or studying for a midterm\n\n",
  "the body is a pretty simple cone with a rectangular base\n\n",
  "arms and chain-legs were inspired by some similar designs that i need to go back and find the links for. i edited the legs adding two things\n\n",
  "- increased flexibility so they would be more floppy and more easily situate themselves on a desk\n\n",
  "- added the PS70 to the base of the feet, inspired by how Woody in Toy Story has Andy's name on his foot\n\n",
  "for the scanning portion of the assignment, i started with LIDAR and tried to scan my camera, but evidently scanning an all-black object creates issues with shadows\n\n",
  "shoutout Zayid for showing me scaniverse, which is a photgrammetry scanning app that was able to create a pretty good scan in like 30 seconds (attached)\n\n",
  "i wanted to keep my scan photography related so tried my external light, but it iniitally blended in with the white table, so i used the light itself to creatre contrast and voila!\n\n",
];

let index = 0;
const typingSpeed = 25;
const typingTextElement = document.getElementById("typing-text");
const cursor = document.getElementById("cursor");

function typeContent() {
  if (index < content.length) {
    const item = content[index];

    if (typeof item === "string") {
      typeString(item, 0);
    } else if (item.type === "link") {
      const linkElement = document.createElement("a");
      linkElement.href = item.href;
      linkElement.className = "red-text";
      linkElement.textContent = "";
      typingTextElement.insertBefore(linkElement, cursor);
      typeStringInElement(linkElement, item.text, 0);
    } else if (item.type === "red") {
      const spanElement = document.createElement("span");
      spanElement.className = "red-text";
      typingTextElement.insertBefore(spanElement, cursor);
      typeStringInElement(spanElement, item.text, 0);
    }
  } else {
    showCodeSnippet(); // Reveal code snippet after typing finishes
  }
}

function typeString(str, charIndex) {
  if (charIndex < str.length) {
    typingTextElement.insertBefore(document.createTextNode(str.charAt(charIndex)), cursor);
    setTimeout(() => typeString(str, charIndex + 1), typingSpeed);
  } else {
    index++;
    setTimeout(typeContent, typingSpeed);
  }
}

function typeStringInElement(element, str, charIndex) {
  if (charIndex < str.length) {
    element.textContent += str.charAt(charIndex);
    setTimeout(() => typeStringInElement(element, str, charIndex + 1), typingSpeed);
  } else {
    cursor.style.visibility = "hidden";  
    index++;
    typingTextElement.insertBefore(document.createElement("br"), cursor);
    setTimeout(() => {
      cursor.style.visibility = "visible";  
      typeContent();
    }, typingSpeed);
  }
}

function showCodeSnippet() {
  const codeContainer = document.getElementById("code-container");
  codeContainer.style.display = "block";
  setTimeout(() => {
    codeContainer.style.opacity = "1";
  }, 100); 
}

function copyToClipboard(elementId) {
  var codeElement = document.getElementById(elementId);
  var text = codeElement.innerText || codeElement.textContent;

  navigator.clipboard.writeText(text).then(() => {
      alert("Code copied to clipboard!");
  }).catch(err => {
      console.error("Failed to copy: ", err);
  });
}

window.onload = typeContent;
</script>

</body>

</html>
