<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ps70 week 8: CNC + MOLDING</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto Mono', monospace;
      background-color: #000;
      color: #fff;
      padding: 20px;
    }
    a { color: #f00; text-decoration: none; }
    .red-text { color: #f00; margin-top: 1em; display: block; }
    .typing-container { white-space: pre-wrap; word-wrap: break-word; }
    .typing-container pre { margin: 0; }
    .typing-container pre span#cursor {
      border-right: 6px solid white;
      animation: blink 0.7s steps(2) infinite;
    }
    @keyframes blink {
      0%,100% { border-color: white; }
      50%     { border-color: transparent; }
    }
    img, iframe {
      display: block;
      margin: 20px auto;
      max-width: 800px;
      border: 2px solid #f00;
    }
    .file-link {
      display: block;
      margin: 0.5em auto;
      color: #ffaaaa;
      max-width: 800px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="typing-container">
    <img
      src="../week7/IMG_0653.png"
      alt="Old-School Loading Image"
      onerror="this.style.display='none'">
    <pre id="typing-text"><span id="cursor"></span></pre>
  </div>

  <!-- media & downloads always visible now -->
  <div id="media-container">
    <span class="red-text">O-Scope Test</span>
    <iframe
      src="https://www.youtube.com/embed/N4iprZ68EkA"
      title="O-Scope Test"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>

    <span class="red-text">MVP Test</span>
    <iframe
      src="https://www.youtube.com/embed/SERgTkPLwu0"
      title="MVP Test"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>

    <span class="red-text">Button Mold (3MF)</span>
    <a class="file-link" href="Button Mold.3mf" download>
      Download Button Mold.3mf
    </a>

    <span class="red-text">IMG_0893</span>
    <img src="IMG_0893.HEIC" alt="IMG_0893 photo" onerror="this.style.display='none'">

    <span class="red-text">IMG_0894</span>
    <img src="IMG_0894.HEIC" alt="IMG_0894 photo" onerror="this.style.display='none'">

    <span class="red-text">Squares Design (DXF)</span>
    <a class="file-link" href="Squares v1.dxf" download>
      Download Squares v1.dxf
    </a>
  </div>

  <script>
    const content = [
      { type:"link", text:"back to home", href:"https://jwasserberger.github.io/ps70/" },
      "\n\n",
      "/week eight: CNC and Molding",
      "\n\n",
      { type:"red", text:"----------------------------------------" },
      "\n\n",
      "now that we have a key, we need a button! I wanted to make one of those soft buttons you might find on a soundboard or DaVinci BlackMagic board as I love how they feel to press.\n\n",
      "i created a mold in fusion and then filled it with silicone rubber, with a 1:1 ratio of each bottle labeled \"A\" and \"B\" respectively in the lab (ended up being about 0.1oz per button).\n\n",
      "button mold file is downloadable below\n\n",
      "for my CNC, i wanted a multilayered \"sculpture\" that took advantage of the CNC's precision capabilities. The attached DXF file is what I came up with, and after some post-processing, the attached image is the final result\n\n"
    ];

    let idx = 0,
        speed = 25,
        textEl = document.getElementById("typing-text"),
        cursor = document.getElementById("cursor");

    function typeNext() {
      if (idx >= content.length) return;
      const item = content[idx++];
      if (typeof item === "string") {
        typeStr(item,0);
      } else if (item.type === "link") {
        injectLink(item);
      } else if (item.type === "red") {
        injectRed(item);
      }
    }

    function typeStr(str,i) {
      if (i < str.length) {
        textEl.insertBefore(document.createTextNode(str[i]), cursor);
        setTimeout(()=>typeStr(str,i+1), speed);
      } else {
        setTimeout(typeNext, speed);
      }
    }

    function injectLink(item) {
      let a = document.createElement("a");
      a.href = item.href;
      a.className = "red-text";
      textEl.insertBefore(a, cursor);
      typeInto(a, item.text);
    }

    function injectRed(item) {
      let span = document.createElement("span");
      span.className = "red-text";
      textEl.insertBefore(span, cursor);
      typeInto(span, item.text);
    }

    function typeInto(el, str, i=0) {
      if (i < str.length) {
        el.textContent += str[i];
        setTimeout(()=>typeInto(el, str, i+1), speed);
      } else {
        textEl.insertBefore(document.createElement("br"), cursor);
        setTimeout(typeNext, speed);
      }
    }

    window.onload = typeNext;
  </script>
</body>
</html>
